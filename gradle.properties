# Обязательно, если в проекте есть AndroidX (а у вас appcompat + material — это всё AndroidX)
android.useAndroidX=true

# Убирает генерацию неиспользуемых R-классов из транзитивных зависимостей;
# ускоряет сборку и уменьшает итоговый размер APK
android.nonTransitiveRClass=true

# Запас памяти демону Gradle — с Android-плагином дефолтных 512 МБ мало
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8